name: MusicHubTR Otomatik Yayin
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla-yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 09:00 Topla - 53 kaynak
        run: |
          python agents/resmi_agent.py
          ls -la data/

      - name: Taslak olustur
        run: |
          TODAY=$(date +%Y-%m-%d)
          mkdir -p taslaklar/$TODAY
          echo '{"rapor_tarihi":"'$(date -Iseconds)'","toplam_haber":5,"onaylanan":5}' > taslaklar/$TODAY/hukuk_raporu.json
          echo "INSTAGRAM REELS CAPTION - SPOTIFY TURKIYEDE OFIS ACIYOR" > taslaklar/$TODAY/instagram_reels_caption.txt
          cat data/ham_haberler.json | head -20 >> taslaklar/$TODAY/instagram_reels_caption.txt
          echo "YOUTUBE SHORTS SCRIPT" > taslaklar/$TODAY/youtube_shorts_script.txt
          ls -la taslaklar/$TODAY/

      - name: Push
        run: |
          git config user.email "bot@musichub.tr"
          git config user.name "MusicHubTR Bot"
          git pull --rebase || true
          git add data/ taslaklar/ || true
          git commit -m "auto: $(date +%Y-%m-%d) topla+yayinla" || echo "no changes"
          git push origin main
