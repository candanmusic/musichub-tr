name: Sabah 08 - MusicHub TR (GECICI DURDURULDU)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 5 * * *'   # 19 Agustos 2026 - manzara post sorunu netlesene kadar durduruldu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install feedgen requests google-generativeai
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py
      - name: Commit RSS
        run: |
          git config user.name "candan-bot"
          git config user.email "bot@candanmusic.tr"
          git add podcast/rss.xml
          git diff --staged --quiet || git commit -m "auto: rss guncelle $(date -u +%Y-%m-%d)"
          git push